run_id: xarm7_t6_10_qwen3OFT_${oc.env:RUN_TIMESTAMP}   # RUN_TIMESTAMP is set by run_xarm7_train.sh at launch: a new output directory for every run
run_root_dir: ./results/Checkpoints
seed: 42
wandb_entity: null               # null = the default entity of the logged-in wandb account
wandb_project: SimVLA-NF
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: Qwen/Qwen3-VL-4B-Instruct   # where the VLM weights are
    attn_implementation: sdpa     # StarVLA's Qwen3 loader (model/modules/vlm/QWen3.py) uses sdpa whatever is written here
    # Starting point: the VLM of this StarVLA checkpoint replaces the one of base_vlm (the action head is not
    # taken: 14-D actions there, 8-D here). null: start from base_vlm.
    finetune_from: playground/Pretrained_models/Qwen3-VL-OFT-Robotwin2/checkpoints/steps_40000_pytorch_model.pt
    lora:                         # LoRA on the VLM; same settings as the TARFlow run
      enabled: true               # false: train all 4.4 B VLM weights (full fine-tuning)
      rank: 32
      alpha: 16                   # adapter scale alpha / rank = 0.5
      dropout: 0.0
      vision: true                # false: language model only, the vision tower stays as pretrained

  action_model:
    action_model_type: MLP
    action_dim: 8      # 7 joint angles + gripper
    action_horizon: 16

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: false
    data_root_dir: /home/nvidia/Projects/prepare_data/data   # the directory that contains xarm7_t6_10/
    data_mix: xarm7_t6_10
    action_mode: abs
    per_device_batch_size: 32
    image_size: 224               # what the dataloader resizes the 448 x 448 images to; 224 as in the checkpoint of finetune_from
    obs_image_size: [224, 224]    # what predict_action resizes to at inference; keep equal to image_size
    num_workers: 16               # per GPU; the default of 4 is too slow for images stored in the parquet files
    video_backend: pyav

trainer:
  max_train_steps: 150000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 1000
  learning_rate:
    base: 1e-05
    qwen_vl_interface: 5.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  freeze_modules: ''
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
